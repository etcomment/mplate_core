<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Write a few lines of text, get a designer-grade infographic. Free, open source, no account." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>mplate studio</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="mplate studio">
        <img src="./favicon.svg" alt="" width="26" height="26" />
        <span>mplate <em>studio</em></span>
      </a>
      <button type="button" class="button" id="templates-button" aria-haspopup="dialog">Templates</button>
      <label class="field">
        <span>Theme</span>
        <select id="theme-select"></select>
      </label>
      <label class="field">
        <span>Width</span>
        <select id="width-select">
          <option value="1200">1200</option>
          <option value="1600">1600</option>
          <option value="960">960</option>
          <option value="800">800</option>
        </select>
      </label>
      <div class="spacer"></div>
      <button type="button" class="button" id="share-button">Copy link</button>
      <button type="button" class="button" id="copy-svg-button">Copy SVG</button>
      <button type="button" class="button" id="svg-button">SVG</button>
      <button type="button" class="button primary" id="png-button">PNG</button>
    </header>
    <main class="workspace">
      <section class="pane editor-pane" aria-label="DSL editor">
        <div class="editor">
          <pre class="gutter" id="gutter" aria-hidden="true"></pre>
          <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="mplate DSL"></textarea>
        </div>
        <ul class="diagnostics" id="diagnostics" aria-live="polite"></ul>
      </section>
      <section class="pane preview-pane" aria-label="Preview">
        <div class="status" id="status"></div>
        <div class="preview" id="preview"></div>
      </section>
    </main>
    <dialog id="templates-dialog" class="templates-dialog" aria-label="Templates">
      <div class="dialog-header">
        <h2>Templates</h2>
        <p>Pick a starting point. Every template adapts to the number of lines you write.</p>
        <button type="button" class="button" id="templates-close">Close</button>
      </div>
      <div class="gallery" id="gallery"></div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
